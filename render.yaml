databases:
  - name: helpdesk-db
    plan: free
    databaseName: helpdesk
    user: helpdesk

services:
  # ---- API ----
  - type: web
    name: helpdesk-api-flame       
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://helpdesk-web-flame.onrender.com  

  # ---- Frontend ----
  - type: web
    name: helpdesk-web-flame        
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL            
        value: https://helpdesk-api-flame.onrender.com   
    routes:
      - type: rewrite
        source: /*
        destination: /index.html